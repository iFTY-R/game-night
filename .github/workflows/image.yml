name: image

on:
  push:
    branches:
      - "master"
    tags:
      - "v*.*.*"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: game_night
          POSTGRES_USER: game_night
          POSTGRES_PASSWORD: game_night
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game_night -d game_night"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GAME_NIGHT_TEST_DATABASE_URL: postgresql://game_night:game_night@127.0.0.1:5432/game_night?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          corepack prepare "pnpm@${pnpm_version}" --activate

      - name: Run short tests
        shell: bash
        run: |
          log_file="$(mktemp)"
          if go test -short ./... 2>&1 | tee "$log_file"; then
            exit 0
          fi

          failures="$(grep -E -- '--- FAIL:|^FAIL[[:space:]]|panic:|fatal error:' "$log_file" | tail -n 20 || true)"
          if [[ -z "$failures" ]]; then
            failures="$(tail -n 20 "$log_file")"
          fi
          while IFS= read -r failure; do
            echo "::error title=Go short tests failed::$failure"
          done <<< "$failures"
          exit 1

      - name: Run vet
        run: go vet ./apps/...

      - name: Run migration smoke tests
        run: go test ./apps/migrate/internal/migrator -run 'TestOpenDatabaseCreatesMissingSchema|TestMigrationsUpDownUp'

      - name: Validate deployment Compose
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet

  build:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase image name
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${owner}/${repo}" >> "$GITHUB_ENV"

      - name: Read toolchain versions
        run: |
          echo "GO_VERSION=$(cat .go-version)" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$(cat .node-version)" >> "$GITHUB_ENV"
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "PNPM_VERSION=${pnpm_version}" >> "$GITHUB_ENV"

      - name: Set build timestamp
        run: echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.IMAGE_CREATED }}

      - name: Publish digest
        run: |
          {
            echo '### Image'
            echo ''
            echo "- Image: \`${{ env.IMAGE_NAME }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
