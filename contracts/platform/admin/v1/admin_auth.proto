syntax = "proto3";

package platform.admin.v1;

import "google/protobuf/timestamp.proto";
import "platform/admin/v1/admin_common.proto";
import "platform/common/v1/common.proto";

option go_package = "github.com/iFTY-R/game-night/contracts/gen/go/platform/admin/v1;adminv1";

// AdminAuthService owns the isolated administrator authentication state machine.
service AdminAuthService {
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse);
  rpc GetCurrentAdminSession(GetCurrentAdminSessionRequest) returns (GetCurrentAdminSessionResponse);
  rpc GetRuntimeReadiness(GetRuntimeReadinessRequest) returns (GetRuntimeReadinessResponse);
  rpc BeginAdminLogin(BeginAdminLoginRequest) returns (BeginAdminLoginResponse);
  rpc LoginPassword(LoginPasswordRequest) returns (LoginPasswordResponse);
  rpc VerifyAdminTotp(VerifyAdminTotpRequest) returns (VerifyAdminTotpResponse);
  rpc VerifyAdminRecoveryCode(VerifyAdminRecoveryCodeRequest) returns (VerifyAdminRecoveryCodeResponse);
  rpc ChangeInitialPassword(ChangeInitialPasswordRequest) returns (ChangeInitialPasswordResponse);
  rpc ChangeAdminPassword(ChangeAdminPasswordRequest) returns (ChangeAdminPasswordResponse);
  rpc BeginTotpEnrollment(BeginTotpEnrollmentRequest) returns (BeginTotpEnrollmentResponse);
  rpc CompleteTotpEnrollment(CompleteTotpEnrollmentRequest) returns (CompleteTotpEnrollmentResponse);
  rpc DisableTotp(DisableTotpRequest) returns (DisableTotpResponse);
  rpc RegenerateAdminRecoveryCodes(RegenerateAdminRecoveryCodesRequest) returns (RegenerateAdminRecoveryCodesResponse);
  rpc ConfirmAdminSecretReceipt(ConfirmAdminSecretReceiptRequest) returns (ConfirmAdminSecretReceiptResponse);
  rpc ElevateAdminSession(ElevateAdminSessionRequest) returns (ElevateAdminSessionResponse);
  rpc RevokeCurrentAdminElevation(RevokeCurrentAdminElevationRequest) returns (RevokeCurrentAdminElevationResponse);
  rpc ListAdminSessions(ListAdminSessionsRequest) returns (ListAdminSessionsResponse);
  rpc RevokeAdminSession(RevokeAdminSessionRequest) returns (RevokeAdminSessionResponse);
  rpc PreviewRevokeOtherAdminSessions(PreviewRevokeOtherAdminSessionsRequest) returns (PreviewRevokeOtherAdminSessionsResponse);
  rpc RevokeOtherAdminSessions(RevokeOtherAdminSessionsRequest) returns (RevokeOtherAdminSessionsResponse);
  rpc LogoutAdmin(LogoutAdminRequest) returns (LogoutAdminResponse);
}

enum AdminSecretOperation {
  ADMIN_SECRET_OPERATION_UNSPECIFIED = 0;
  ADMIN_SECRET_OPERATION_TOTP_ENROLLMENT = 1;
  ADMIN_SECRET_OPERATION_INITIAL_RECOVERY_CODES = 2;
  ADMIN_SECRET_OPERATION_REGENERATED_RECOVERY_CODES = 3;
}

enum AdminElevationSecondFactor {
  ADMIN_ELEVATION_SECOND_FACTOR_UNSPECIFIED = 0;
  ADMIN_ELEVATION_SECOND_FACTOR_TOTP = 1;
  ADMIN_ELEVATION_SECOND_FACTOR_RECOVERY_CODE = 2;
}

message GetSetupStateRequest {}

message GetSetupStateResponse {
  AdminAccountState state = 1;
}

message GetCurrentAdminSessionRequest {}

message GetCurrentAdminSessionResponse {
  AdminSessionSummary session = 1;
}

message GetRuntimeReadinessRequest {}

message RuntimeReadinessState {
  string mode = 1;
  bool ready = 2;
  map<string, string> components = 3;
}

message GetRuntimeReadinessResponse {
  RuntimeReadinessState ordinary = 1;
  RuntimeReadinessState sensitive = 2;
}

message BeginAdminLoginRequest {
  string request_flow_id = 1;
}

message BeginAdminLoginResponse {
  platform.common.v1.AnonymousChallenge challenge = 1;
}

message LoginPasswordRequest {
  string challenge_proof = 1;
  string password = 2;
}

message LoginRequiresInitialPasswordChange {
  AdminSessionSummary session = 1;
}

message LoginRequiresMfa {
  AdminSessionSummary session = 1;
}

message LoginPasswordResponse {
  oneof outcome {
    LoginRequiresInitialPasswordChange requires_initial_password_change = 1;
    LoginRequiresMfa requires_mfa = 2;
    AdminSessionSummary session = 3;
  }
}

message VerifyAdminTotpRequest {
  string totp_code = 1;
}

message VerifyAdminTotpResponse {
  AdminSessionSummary session = 1;
}

message VerifyAdminRecoveryCodeRequest {
  string recovery_code = 1;
}

message VerifyAdminRecoveryCodeResponse {
  AdminSessionSummary session = 1;
}

message ChangeInitialPasswordRequest {
  string new_password = 1;
}

message ChangeInitialPasswordResponse {
  AdminSessionSummary session = 1;
}

message ChangeAdminPasswordRequest {
  string operation_id = 1;
  string current_password = 2;
  string new_password = 3;
  uint64 expected_password_version = 4;
}

message ChangeAdminPasswordResponse {
  string operation_id = 1;
  AdminSessionSummary session = 2;
  int32 revoked_sessions = 3;
}

message BeginTotpEnrollmentRequest {
  string operation_id = 1;
  string current_password = 2;
}

message BeginTotpEnrollmentResponse {
  platform.common.v1.OperationResult result = 1;
  string manual_entry_key = 2;
  string otpauth_uri = 3;
}

message CompleteTotpEnrollmentRequest {
  string enrollment_operation_id = 1;
  string recovery_codes_operation_id = 2;
  string totp_code = 3;
}

message CompleteTotpEnrollmentResponse {
  platform.common.v1.OperationResult result = 1;
  repeated string recovery_codes = 2;
  AdminSessionSummary session = 3;
  int32 revoked_sessions = 4;
}

message DisableTotpRequest {
  string operation_id = 1;
  string reason = 2;
  uint64 expected_enrollment_version = 3;
}

message DisableTotpResponse {
  string operation_id = 1;
  AdminSessionSummary session = 2;
  int32 revoked_sessions = 3;
  bool already_disabled = 4;
}

message RegenerateAdminRecoveryCodesRequest {
  string operation_id = 1;
  uint64 expected_recovery_codes_version = 2;
}

message RegenerateAdminRecoveryCodesResponse {
  platform.common.v1.OperationResult result = 1;
  repeated string recovery_codes = 2;
  AdminSessionSummary session = 3;
}

message ConfirmAdminSecretReceiptRequest {
  AdminSecretOperation operation = 1;
  string operation_id = 2;
  string result_id = 3;
}

message ConfirmAdminSecretReceiptResponse {
  bool confirmed = 1;
}

message ElevateAdminSessionRequest {
  string operation_id = 1;
  AdminElevationScope scope = 2;
  string current_password = 3;
  oneof second_factor {
    string totp_code = 4;
    string recovery_code = 5;
  }
}

message ElevateAdminSessionResponse {
  string operation_id = 1;
  AdminElevationSummary elevation = 2;
  AdminSessionSummary session = 3;
  AdminElevationSecondFactor second_factor = 4;
}

message RevokeCurrentAdminElevationRequest {
  AdminElevationScope scope = 1;
}

message RevokeCurrentAdminElevationResponse {
  bool revoked = 1;
  AdminSessionSummary session = 2;
}

message ListAdminSessionsRequest {}

message ListAdminSessionsResponse {
  repeated AdminSessionInfo sessions = 1;
}

message RevokeAdminSessionRequest {
  string operation_id = 1;
  string session_id = 2;
  uint64 expected_session_version = 3;
}

message RevokeAdminSessionResponse {
  string operation_id = 1;
  string session_id = 2;
  bool revoked = 3;
}

message PreviewRevokeOtherAdminSessionsRequest {}

message PreviewRevokeOtherAdminSessionsResponse {
  string preview_version = 1;
  uint64 current_admin_version = 2;
  uint64 current_session_version = 3;
  int32 other_session_count = 4;
  repeated AdminSessionInfo sessions = 5;
}

message RevokeOtherAdminSessionsRequest {
  string operation_id = 1;
  string preview_version = 2;
  uint64 expected_admin_version = 3;
  uint64 expected_current_session_version = 4;
}

message RevokeOtherAdminSessionsResponse {
  string operation_id = 1;
  int32 revoked_sessions = 2;
  AdminSessionSummary session = 3;
}

message LogoutAdminRequest {}

message LogoutAdminResponse {
  bool logged_out = 1;
}
