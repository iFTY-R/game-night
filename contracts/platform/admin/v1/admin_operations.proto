syntax = "proto3";

package platform.admin.v1;

import "google/protobuf/timestamp.proto";
import "platform/admin/v1/admin_common.proto";

option go_package = "github.com/iFTY-R/game-night/contracts/gen/go/platform/admin/v1;adminv1";

// AdminOperationsService exposes bounded runtime diagnostics and reviewed maintenance commands.
service AdminOperationsService {
  rpc GetOperationsSnapshot(GetOperationsSnapshotRequest) returns (GetOperationsSnapshotResponse);
  rpc GetMaintenanceState(GetMaintenanceStateRequest) returns (GetMaintenanceStateResponse);
  rpc PreviewMaintenanceChange(PreviewMaintenanceChangeRequest) returns (PreviewMaintenanceChangeResponse);
  rpc ApplyMaintenanceChange(ApplyMaintenanceChangeRequest) returns (ApplyMaintenanceChangeResponse);
  rpc PreviewCacheRefresh(PreviewCacheRefreshRequest) returns (PreviewCacheRefreshResponse);
  rpc ApplyCacheRefresh(ApplyCacheRefreshRequest) returns (ApplyCacheRefreshResponse);
  rpc PreviewTaskRetry(PreviewTaskRetryRequest) returns (PreviewTaskRetryResponse);
  rpc ApplyTaskRetry(ApplyTaskRetryRequest) returns (ApplyTaskRetryResponse);
}

// AdminHealthStatus is the closed health vocabulary returned to administrators.
enum AdminHealthStatus {
  ADMIN_HEALTH_STATUS_UNSPECIFIED = 0;
  ADMIN_HEALTH_STATUS_HEALTHY = 1;
  ADMIN_HEALTH_STATUS_DEGRADED = 2;
  ADMIN_HEALTH_STATUS_UNAVAILABLE = 3;
  ADMIN_HEALTH_STATUS_STALE = 4;
}

// AdminServiceKind identifies one of the four deployable game-night processes.
enum AdminServiceKind {
  ADMIN_SERVICE_KIND_UNSPECIFIED = 0;
  ADMIN_SERVICE_KIND_API = 1;
  ADMIN_SERVICE_KIND_EDGE = 2;
  ADMIN_SERVICE_KIND_REALTIME = 3;
  ADMIN_SERVICE_KIND_WORKER = 4;
}

// AdminDependencyKind identifies a reviewed dependency without exposing connection material.
enum AdminDependencyKind {
  ADMIN_DEPENDENCY_KIND_UNSPECIFIED = 0;
  ADMIN_DEPENDENCY_KIND_POSTGRESQL = 1;
  ADMIN_DEPENDENCY_KIND_REDIS = 2;
  ADMIN_DEPENDENCY_KIND_EXPORT_RESULT_STORE = 3;
  ADMIN_DEPENDENCY_KIND_CHECKPOINT_SINK = 4;
  ADMIN_DEPENDENCY_KIND_CHECKPOINT_PROGRESS = 5;
  ADMIN_DEPENDENCY_KIND_REALTIME_PRESENCE = 6;
  ADMIN_DEPENDENCY_KIND_RATE_LIMITER = 7;
}

// AdminBacklogKind identifies bounded durable work that can be summarized safely.
enum AdminBacklogKind {
  ADMIN_BACKLOG_KIND_UNSPECIFIED = 0;
  ADMIN_BACKLOG_KIND_AUDIT_OUTBOX = 1;
  ADMIN_BACKLOG_KIND_ROOM_OUTBOX = 2;
  ADMIN_BACKLOG_KIND_REALTIME_TIMER = 3;
  ADMIN_BACKLOG_KIND_USER_BATCH = 4;
  ADMIN_BACKLOG_KIND_USER_ERASURE = 5;
}

// AdminMaintenanceScope is deliberately closed so maintenance cannot disable arbitrary surfaces.
enum AdminMaintenanceScope {
  ADMIN_MAINTENANCE_SCOPE_UNSPECIFIED = 0;
  ADMIN_MAINTENANCE_SCOPE_USER_MUTATIONS = 1;
}

// AdminCacheNamespace names only projections that are safe to rebuild.
enum AdminCacheNamespace {
  ADMIN_CACHE_NAMESPACE_UNSPECIFIED = 0;
  ADMIN_CACHE_NAMESPACE_OVERVIEW_PROJECTION = 1;
  ADMIN_CACHE_NAMESPACE_OPERATIONS_PROBES = 2;
  ADMIN_CACHE_NAMESPACE_REALTIME_PRESENCE_PROJECTION = 3;
}

// AdminRetryTaskKind names durable jobs eligible for an explicit manual retry.
enum AdminRetryTaskKind {
  ADMIN_RETRY_TASK_KIND_UNSPECIFIED = 0;
  ADMIN_RETRY_TASK_KIND_USER_BATCH = 1;
  ADMIN_RETRY_TASK_KIND_USER_ERASURE = 2;
}

// AdminOperationsCommandOutcome gives idempotent command callers a stable result vocabulary.
enum AdminOperationsCommandOutcome {
  ADMIN_OPERATIONS_COMMAND_OUTCOME_UNSPECIFIED = 0;
  ADMIN_OPERATIONS_COMMAND_OUTCOME_APPLIED = 1;
  ADMIN_OPERATIONS_COMMAND_OUTCOME_NO_CHANGE = 2;
  ADMIN_OPERATIONS_COMMAND_OUTCOME_CONFLICT = 3;
  ADMIN_OPERATIONS_COMMAND_OUTCOME_REJECTED = 4;
}

// AdminServiceComponentStatus reports one fixed component code for a service instance.
message AdminServiceComponentStatus {
  string component_code = 1;
  AdminHealthStatus status = 2;
}

// AdminServiceInstance reports bounded process identity and heartbeat freshness.
message AdminServiceInstance {
  AdminServiceKind kind = 1;
  string instance_id = 2;
  string build_version = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp last_heartbeat_at = 5;
  AdminHealthStatus status = 6;
  uint64 maintenance_version = 7;
  repeated AdminServiceComponentStatus components = 8;
}

// AdminDependencyHealth reports one sampled dependency status without raw diagnostic text.
message AdminDependencyHealth {
  AdminDependencyKind kind = 1;
  AdminHealthStatus status = 2;
  google.protobuf.Timestamp sampled_at = 3;
  google.protobuf.Timestamp fresh_until = 4;
}

// AdminRealtimePeerSummary reports aggregate presence only; it is not an identity source.
message AdminRealtimePeerSummary {
  string instance_id = 1;
  AdminHealthStatus status = 2;
  uint64 active_connections = 3;
  uint64 online_users = 4;
  google.protobuf.Timestamp sampled_at = 5;
  google.protobuf.Timestamp fresh_until = 6;
}

// AdminRateLimitSummary identifies the active bounded policy and its dependency health.
message AdminRateLimitSummary {
  string policy_name = 1;
  string configuration_version = 2;
  AdminHealthStatus dependency_status = 3;
  google.protobuf.Timestamp sampled_at = 4;
}

// AdminBacklogSummary reports aggregate durable job state without job payloads.
message AdminBacklogSummary {
  AdminBacklogKind kind = 1;
  uint64 pending = 2;
  uint64 running = 3;
  uint64 failed = 4;
  google.protobuf.Timestamp oldest_pending_at = 5;
  google.protobuf.Timestamp sampled_at = 6;
  google.protobuf.Timestamp fresh_until = 7;
}

// AdminMaintenanceState is the versioned PostgreSQL authority for user mutation admission.
message AdminMaintenanceState {
  bool enabled = 1;
  AdminMaintenanceScope scope = 2;
  string reason = 3;
  google.protobuf.Timestamp planned_end_at = 4;
  uint64 version = 5;
  string changed_by_admin_id = 6;
  google.protobuf.Timestamp changed_at = 7;
}

message GetOperationsSnapshotRequest {}

message GetOperationsSnapshotResponse {
  repeated AdminServiceInstance services = 1;
  repeated AdminDependencyHealth dependencies = 2;
  repeated AdminRealtimePeerSummary realtime_peers = 3;
  AdminRateLimitSummary rate_limit = 4;
  repeated AdminBacklogSummary backlogs = 5;
  AdminMaintenanceState maintenance = 6;
  google.protobuf.Timestamp sampled_at = 7;
  google.protobuf.Timestamp fresh_until = 8;
}

message GetMaintenanceStateRequest {}

message GetMaintenanceStateResponse {
  AdminMaintenanceState maintenance = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message PreviewMaintenanceChangeRequest {
  bool enabled = 1;
  AdminMaintenanceScope scope = 2;
  string reason = 3;
  google.protobuf.Timestamp planned_end_at = 4;
}

message PreviewMaintenanceChangeResponse {
  AdminMaintenanceState current = 1;
  AdminMaintenanceState target = 2;
  uint64 active_rooms = 3;
  uint64 active_games = 4;
  repeated string rejected_procedure_codes = 5;
  string preview_digest = 6;
  google.protobuf.Timestamp sampled_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message ApplyMaintenanceChangeRequest {
  string operation_id = 1;
  bool enabled = 2;
  AdminMaintenanceScope scope = 3;
  string reason = 4;
  google.protobuf.Timestamp planned_end_at = 5;
  uint64 expected_version = 6;
  string preview_digest = 7;
}

message ApplyMaintenanceChangeResponse {
  AdminOperationReceipt receipt = 1;
  AdminOperationsCommandOutcome outcome = 2;
  AdminMaintenanceState maintenance = 3;
}

message PreviewCacheRefreshRequest {
  AdminCacheNamespace namespace = 1;
  string reason = 2;
}

message PreviewCacheRefreshResponse {
  AdminCacheNamespace namespace = 1;
  uint64 current_generation = 2;
  uint64 estimated_entries = 3;
  string preview_digest = 4;
  google.protobuf.Timestamp sampled_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ApplyCacheRefreshRequest {
  string operation_id = 1;
  AdminCacheNamespace namespace = 2;
  string reason = 3;
  uint64 expected_generation = 4;
  string preview_digest = 5;
}

message ApplyCacheRefreshResponse {
  AdminOperationReceipt receipt = 1;
  AdminOperationsCommandOutcome outcome = 2;
  AdminCacheNamespace namespace = 3;
  uint64 previous_generation = 4;
  uint64 current_generation = 5;
}

message PreviewTaskRetryRequest {
  AdminRetryTaskKind task_kind = 1;
  string task_id = 2;
  string reason = 3;
}

message PreviewTaskRetryResponse {
  AdminRetryTaskKind task_kind = 1;
  string task_id = 2;
  AdminJobState current_state = 3;
  uint64 task_version = 4;
  uint32 manual_retry_count = 5;
  bool retry_allowed = 6;
  string stable_error_code = 7;
  string preview_digest = 8;
  google.protobuf.Timestamp sampled_at = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message ApplyTaskRetryRequest {
  string operation_id = 1;
  AdminRetryTaskKind task_kind = 2;
  string task_id = 3;
  string reason = 4;
  uint64 expected_task_version = 5;
  string preview_digest = 6;
}

message ApplyTaskRetryResponse {
  AdminOperationReceipt receipt = 1;
  AdminOperationsCommandOutcome outcome = 2;
  AdminRetryTaskKind task_kind = 3;
  string task_id = 4;
  AdminJobState task_state = 5;
  uint64 task_version = 6;
  uint32 manual_retry_count = 7;
}
