syntax = "proto3";

package platform.admin.v1;

import "google/protobuf/timestamp.proto";
import "platform/admin/v1/admin_common.proto";
import "platform/game/v1/game.proto";
import "platform/room/v1/room.proto";

option go_package = "github.com/iFTY-R/game-night/contracts/gen/go/platform/admin/v1;adminv1";

// AdminRoomService owns room/game management queries, constrained live controls, and fixed emergency repairs.
service AdminRoomService {
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  rpc GetGame(GetGameRequest) returns (GetGameResponse);
  rpc SetRoomAdmission(SetRoomAdmissionRequest) returns (SetRoomAdmissionResponse);
  rpc RemoveRoomMember(RemoveRoomMemberRequest) returns (RemoveRoomMemberResponse);
  rpc ForceCloseRoom(ForceCloseRoomRequest) returns (ForceCloseRoomResponse);
  rpc ForceTerminateGame(ForceTerminateGameRequest) returns (ForceTerminateGameResponse);
  rpc PreviewEmergencyRepair(PreviewEmergencyRepairRequest) returns (PreviewEmergencyRepairResponse);
  rpc ExecuteEmergencyRepair(ExecuteEmergencyRepairRequest) returns (ExecuteEmergencyRepairResponse);
  rpc GetRepairOperation(GetRepairOperationRequest) returns (GetRepairOperationResponse);
}

// AdminOwnerFreshness describes whether the realtime owner lease is usable for coordinated commands.
enum AdminOwnerFreshness {
  ADMIN_OWNER_FRESHNESS_UNSPECIFIED = 0;
  ADMIN_OWNER_FRESHNESS_FRESH = 1;
  ADMIN_OWNER_FRESHNESS_STALE = 2;
  ADMIN_OWNER_FRESHNESS_EXPIRED = 3;
  ADMIN_OWNER_FRESHNESS_MISSING = 4;
  ADMIN_OWNER_FRESHNESS_UNKNOWN = 5;
}

// AdminRoomAnomalyFlag is a bounded, display-safe reason a room row needs operator attention.
enum AdminRoomAnomalyFlag {
  ADMIN_ROOM_ANOMALY_FLAG_UNSPECIFIED = 0;
  ADMIN_ROOM_ANOMALY_FLAG_OWNER_STALE = 1;
  ADMIN_ROOM_ANOMALY_FLAG_OWNER_MISSING = 2;
  ADMIN_ROOM_ANOMALY_FLAG_ALL_PLAYERS_OFFLINE = 3;
  ADMIN_ROOM_ANOMALY_FLAG_ROOM_GAME_LINK_MISMATCH = 4;
}

// AdminGameAnomalyFlag is a bounded, display-safe reason a game row needs operator attention.
enum AdminGameAnomalyFlag {
  ADMIN_GAME_ANOMALY_FLAG_UNSPECIFIED = 0;
  ADMIN_GAME_ANOMALY_FLAG_OWNER_STALE = 1;
  ADMIN_GAME_ANOMALY_FLAG_OWNER_MISSING = 2;
  ADMIN_GAME_ANOMALY_FLAG_NO_RECENT_PROGRESS = 3;
  ADMIN_GAME_ANOMALY_FLAG_ROOM_LINK_MISMATCH = 4;
}

// AdminRepairType is the complete set of emergency repairs; arbitrary patches are intentionally unsupported.
enum AdminRepairType {
  ADMIN_REPAIR_TYPE_UNSPECIFIED = 0;
  ADMIN_REPAIR_TYPE_CLEAR_STALE_OWNER_LEASE = 1;
  ADMIN_REPAIR_TYPE_TERMINATE_UNRECOVERABLE_GAME = 2;
  ADMIN_REPAIR_TYPE_REPAIR_ROOM_GAME_LINK = 3;
}

// AdminRepairState tracks a repair plan from dry-run through execution without exposing mutable after-state.
enum AdminRepairState {
  ADMIN_REPAIR_STATE_UNSPECIFIED = 0;
  ADMIN_REPAIR_STATE_PREVIEWED = 1;
  ADMIN_REPAIR_STATE_EXECUTED = 2;
  ADMIN_REPAIR_STATE_REJECTED = 3;
  ADMIN_REPAIR_STATE_EXPIRED = 4;
}

// AdminRoomCommandOutcome is stable across daily controls and owner-coordinated termination attempts.
enum AdminRoomCommandOutcome {
  ADMIN_ROOM_COMMAND_OUTCOME_UNSPECIFIED = 0;
  ADMIN_ROOM_COMMAND_OUTCOME_EXECUTED = 1;
  ADMIN_ROOM_COMMAND_OUTCOME_NO_CHANGE = 2;
  ADMIN_ROOM_COMMAND_OUTCOME_VERSION_CONFLICT = 3;
  ADMIN_ROOM_COMMAND_OUTCOME_OWNER_UNREACHABLE = 4;
  ADMIN_ROOM_COMMAND_OUTCOME_REPAIR_REQUIRED = 5;
  ADMIN_ROOM_COMMAND_OUTCOME_REJECTED = 6;
}

enum AdminRoomSortField {
  ADMIN_ROOM_SORT_FIELD_UNSPECIFIED = 0;
  ADMIN_ROOM_SORT_FIELD_UPDATED_AT = 1;
  ADMIN_ROOM_SORT_FIELD_CREATED_AT = 2;
  ADMIN_ROOM_SORT_FIELD_LAST_ACTIVITY_AT = 3;
  ADMIN_ROOM_SORT_FIELD_ROOM_CODE = 4;
}

enum AdminGameSortField {
  ADMIN_GAME_SORT_FIELD_UNSPECIFIED = 0;
  ADMIN_GAME_SORT_FIELD_UPDATED_AT = 1;
  ADMIN_GAME_SORT_FIELD_STARTED_AT = 2;
  ADMIN_GAME_SORT_FIELD_LAST_PROGRESS_AT = 3;
  ADMIN_GAME_SORT_FIELD_SESSION_ID = 4;
}

message AdminOwnerLeaseSummary {
  string session_id = 1;
  string owner_instance_id = 2;
  string owner_address = 3;
  uint64 ownership_epoch = 4;
  AdminOwnerFreshness freshness = 5;
  google.protobuf.Timestamp observed_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message AdminRoomFilter {
  string room_id = 1;
  string room_code = 2;
  repeated platform.room.v1.RoomStatus statuses = 3;
  repeated string game_ids = 4;
  string host_user_id = 5;
  string member_user_id = 6;
  bool anomalies_only = 7;
  google.protobuf.Timestamp created_from = 8;
  google.protobuf.Timestamp created_to = 9;
  google.protobuf.Timestamp updated_from = 10;
  google.protobuf.Timestamp updated_to = 11;
}

message AdminRoomSort {
  AdminRoomSortField field = 1;
  AdminSortDirection direction = 2;
}

message AdminRoomSummary {
  string room_id = 1;
  string room_code = 2;
  platform.room.v1.RoomStatus status = 3;
  string active_game_id = 4;
  string active_session_id = 5;
  string host_user_id = 6;
  string host_username = 7;
  int32 participant_count = 8;
  int32 spectator_count = 9;
  platform.room.v1.AdmissionMode participant_admission = 10;
  platform.room.v1.AdmissionMode spectator_admission = 11;
  uint64 room_version = 12;
  uint64 membership_version = 13;
  uint64 ownership_epoch = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  google.protobuf.Timestamp last_activity_at = 17;
  AdminOwnerLeaseSummary owner = 18;
  repeated AdminRoomAnomalyFlag anomalies = 19;
}

message AdminRoomMemberSummary {
  string user_id = 1;
  string username = 2;
  platform.room.v1.MemberRole role = 3;
  platform.room.v1.MemberRole requested_role = 4;
  google.protobuf.Timestamp joined_at = 5;
  uint64 membership_version = 6;
  bool online = 7;
}

message AdminRoomEventSummary {
  string event_id = 1;
  string event_type = 2;
  string actor_user_id = 3;
  string digest = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message AdminRoomDetail {
  AdminRoomSummary summary = 1;
  repeated AdminRoomMemberSummary members = 2;
  repeated AdminGameSummary active_games = 3;
  repeated AdminRoomEventSummary recent_events = 4;
}

message AdminGameFilter {
  string session_id = 1;
  string room_id = 2;
  repeated string game_ids = 3;
  repeated platform.game.v1.GameSessionStatus statuses = 4;
  bool anomalies_only = 5;
  google.protobuf.Timestamp started_from = 6;
  google.protobuf.Timestamp started_to = 7;
  google.protobuf.Timestamp updated_from = 8;
  google.protobuf.Timestamp updated_to = 9;
}

message AdminGameSort {
  AdminGameSortField field = 1;
  AdminSortDirection direction = 2;
}

message AdminGameParticipantSummary {
  string user_id = 1;
  string username = 2;
  platform.room.v1.MemberRole room_role = 3;
  bool active = 4;
}

message AdminGameSummary {
  string session_id = 1;
  string room_id = 2;
  string room_code = 3;
  string game_id = 4;
  string game_version = 5;
  platform.game.v1.GameSessionStatus status = 6;
  uint64 state_version = 7;
  uint64 ownership_epoch = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_progress_at = 11;
  AdminOwnerLeaseSummary owner = 12;
  repeated AdminGameAnomalyFlag anomalies = 13;
}

message AdminGameEventSummary {
  string event_id = 1;
  string event_type = 2;
  uint64 state_version = 3;
  string actor_user_id = 4;
  string digest = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message AdminGameDetail {
  AdminGameSummary summary = 1;
  repeated AdminGameParticipantSummary participants = 2;
  repeated AdminGameEventSummary recent_events = 3;
}

message ListRoomsRequest {
  AdminRoomFilter filter = 1;
  AdminRoomSort sort = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListRoomsResponse {
  repeated AdminRoomSummary rooms = 1;
  AdminPageInfo page = 2;
}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  AdminRoomDetail room = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message ListGamesRequest {
  AdminGameFilter filter = 1;
  AdminGameSort sort = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListGamesResponse {
  repeated AdminGameSummary games = 1;
  AdminPageInfo page = 2;
}

message GetGameRequest {
  string session_id = 1;
}

message GetGameResponse {
  AdminGameDetail game = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message SetRoomAdmissionRequest {
  string operation_id = 1;
  string room_id = 2;
  platform.room.v1.AdmissionMode participant_admission = 3;
  platform.room.v1.AdmissionMode spectator_admission = 4;
  string reason = 5;
  uint64 expected_room_version = 6;
}

message SetRoomAdmissionResponse {
  AdminOperationReceipt receipt = 1;
  AdminRoomCommandOutcome outcome = 2;
  AdminRoomSummary room = 3;
}

message RemoveRoomMemberRequest {
  string operation_id = 1;
  string room_id = 2;
  string user_id = 3;
  string reason = 4;
  uint64 expected_room_version = 5;
  uint64 expected_membership_version = 6;
}

message RemoveRoomMemberResponse {
  AdminOperationReceipt receipt = 1;
  AdminRoomCommandOutcome outcome = 2;
  AdminRoomSummary room = 3;
  int32 revoked_connections = 4;
}

message ForceCloseRoomRequest {
  string operation_id = 1;
  string room_id = 2;
  string reason = 3;
  uint64 expected_room_version = 4;
}

message ForceCloseRoomResponse {
  AdminOperationReceipt receipt = 1;
  AdminRoomCommandOutcome outcome = 2;
  AdminRoomSummary room = 3;
}

message ForceTerminateGameRequest {
  string operation_id = 1;
  string session_id = 2;
  string reason = 3;
  uint64 expected_state_version = 4;
  uint64 expected_ownership_epoch = 5;
}

message ForceTerminateGameResponse {
  AdminOperationReceipt receipt = 1;
  AdminRoomCommandOutcome outcome = 2;
  AdminGameSummary game = 3;
  bool repair_required = 4;
}

message PreviewEmergencyRepairRequest {
  string target_id = 1;
  AdminRepairType repair_type = 2;
  string reason = 3;
}

message PreviewEmergencyRepairResponse {
  AdminRepairOperation repair = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message ExecuteEmergencyRepairRequest {
  string operation_id = 1;
  string repair_id = 2;
  string reason = 3;
  uint64 expected_repair_version = 4;
}

message ExecuteEmergencyRepairResponse {
  AdminOperationReceipt receipt = 1;
  AdminRepairOperation repair = 2;
}

message GetRepairOperationRequest {
  string repair_id = 1;
}

message GetRepairOperationResponse {
  AdminRepairOperation repair = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message AdminRepairOperation {
  string repair_id = 1;
  AdminRepairType repair_type = 2;
  AdminRepairState state = 3;
  string target_id = 4;
  string target_digest = 5;
  string preview_digest = 6;
  uint64 repair_version = 7;
  uint64 expected_room_version = 8;
  uint64 expected_membership_version = 9;
  uint64 expected_state_version = 10;
  uint64 expected_ownership_epoch = 11;
  string summary = 12;
  repeated string irreversible_effects = 13;
  string before_snapshot_digest = 14;
  string after_snapshot_digest = 15;
  string requested_by_admin_id = 16;
  string audit_event_id = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp expires_at = 19;
  google.protobuf.Timestamp executed_at = 20;
}
