syntax = "proto3";

package platform.admin.v1;

import "google/protobuf/timestamp.proto";
import "platform/admin/v1/admin_common.proto";
import "platform/game/v1/game.proto";
import "platform/room/v1/room.proto";

option go_package = "github.com/iFTY-R/game-night/contracts/gen/go/platform/admin/v1;adminv1";

// AdminUserService owns user-center queries, annotations, governance, batch jobs, and controlled exports.
service AdminUserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUserPII(GetUserPIIRequest) returns (GetUserPIIResponse);
  rpc ListUserTags(ListUserTagsRequest) returns (ListUserTagsResponse);
  rpc CreateUserTag(CreateUserTagRequest) returns (CreateUserTagResponse);
  rpc UpdateUserTag(UpdateUserTagRequest) returns (UpdateUserTagResponse);
  rpc DeleteUserTag(DeleteUserTagRequest) returns (DeleteUserTagResponse);
  rpc SetUserTags(SetUserTagsRequest) returns (SetUserTagsResponse);
  rpc ListUserNotes(ListUserNotesRequest) returns (ListUserNotesResponse);
  rpc AppendUserNote(AppendUserNoteRequest) returns (AppendUserNoteResponse);
  rpc PreviewUserCommand(PreviewUserCommandRequest) returns (PreviewUserCommandResponse);
  rpc ExecuteUserCommand(ExecuteUserCommandRequest) returns (ExecuteUserCommandResponse);
  rpc PreviewBatchUserOperation(PreviewBatchUserOperationRequest) returns (PreviewBatchUserOperationResponse);
  rpc StartBatchUserOperation(StartBatchUserOperationRequest) returns (StartBatchUserOperationResponse);
  rpc GetBatchUserOperation(GetBatchUserOperationRequest) returns (GetBatchUserOperationResponse);
  rpc ListBatchUserOperations(ListBatchUserOperationsRequest) returns (ListBatchUserOperationsResponse);
  rpc ListBatchUserOperationItems(ListBatchUserOperationItemsRequest) returns (ListBatchUserOperationItemsResponse);
  rpc CancelBatchUserOperation(CancelBatchUserOperationRequest) returns (CancelBatchUserOperationResponse);
  rpc RetryBatchUserOperation(RetryBatchUserOperationRequest) returns (RetryBatchUserOperationResponse);
  rpc CreateUserExport(CreateUserExportRequest) returns (CreateUserExportResponse);
  rpc GetUserExport(GetUserExportRequest) returns (GetUserExportResponse);
  rpc ListUserExports(ListUserExportsRequest) returns (ListUserExportsResponse);
  rpc CreateExportDownloadGrant(CreateExportDownloadGrantRequest) returns (CreateExportDownloadGrantResponse);
  rpc DeleteExportResult(DeleteExportResultRequest) returns (DeleteExportResultResponse);
}

// AdminUserStatus is the management read-model view of the identity lifecycle.
enum AdminUserStatus {
  ADMIN_USER_STATUS_UNSPECIFIED = 0;
  ADMIN_USER_STATUS_ONBOARDING = 1;
  ADMIN_USER_STATUS_ACTIVE = 2;
  ADMIN_USER_STATUS_SUSPENDED = 3;
  ADMIN_USER_STATUS_DELETED = 4;
}

// AdminUserPresenceFilter makes online filtering explicit instead of overloading a boolean default.
enum AdminUserPresenceFilter {
  ADMIN_USER_PRESENCE_FILTER_UNSPECIFIED = 0;
  ADMIN_USER_PRESENCE_FILTER_ANY = 1;
  ADMIN_USER_PRESENCE_FILTER_ONLINE = 2;
  ADMIN_USER_PRESENCE_FILTER_OFFLINE = 3;
}

// AdminUserSortField is the closed set of indexed, stable user-list sort keys.
enum AdminUserSortField {
  ADMIN_USER_SORT_FIELD_UNSPECIFIED = 0;
  ADMIN_USER_SORT_FIELD_CREATED_AT = 1;
  ADMIN_USER_SORT_FIELD_LAST_ACTIVITY_AT = 2;
  ADMIN_USER_SORT_FIELD_USERNAME = 3;
  ADMIN_USER_SORT_FIELD_USER_ID = 4;
}

// AdminUserPIIField names authorized profile values without placing them on the ordinary detail response.
enum AdminUserPIIField {
  ADMIN_USER_PII_FIELD_UNSPECIFIED = 0;
  ADMIN_USER_PII_FIELD_REAL_NAME = 1;
}

// AdminUserDeviceState is the management view of one device credential lifecycle.
enum AdminUserDeviceState {
  ADMIN_USER_DEVICE_STATE_UNSPECIFIED = 0;
  ADMIN_USER_DEVICE_STATE_ACTIVE = 1;
  ADMIN_USER_DEVICE_STATE_REVOKED = 2;
  ADMIN_USER_DEVICE_STATE_EXPIRED = 3;
}

// AdminUserCommandType enumerates reviewed single-user governance commands; arbitrary patches are not supported.
enum AdminUserCommandType {
  ADMIN_USER_COMMAND_TYPE_UNSPECIFIED = 0;
  ADMIN_USER_COMMAND_TYPE_SUSPEND = 1;
  ADMIN_USER_COMMAND_TYPE_UNSUSPEND = 2;
  ADMIN_USER_COMMAND_TYPE_REVOKE_ALL_DEVICES = 3;
  ADMIN_USER_COMMAND_TYPE_REMOVE_FROM_CURRENT_ROOM = 4;
  ADMIN_USER_COMMAND_TYPE_DELETE = 5;
}

// AdminUserCommandOutcome is the stable result classification returned after a governance command.
enum AdminUserCommandOutcome {
  ADMIN_USER_COMMAND_OUTCOME_UNSPECIFIED = 0;
  ADMIN_USER_COMMAND_OUTCOME_EXECUTED = 1;
  ADMIN_USER_COMMAND_OUTCOME_NO_CHANGE = 2;
  ADMIN_USER_COMMAND_OUTCOME_REJECTED = 3;
}

// AdminUserCommandBlockerType describes why a preview cannot be executed without leaking internal state.
enum AdminUserCommandBlockerType {
  ADMIN_USER_COMMAND_BLOCKER_TYPE_UNSPECIFIED = 0;
  ADMIN_USER_COMMAND_BLOCKER_TYPE_ACTIVE_GAME = 1;
  ADMIN_USER_COMMAND_BLOCKER_TYPE_PENDING_EXPORT = 2;
  ADMIN_USER_COMMAND_BLOCKER_TYPE_VERSION_CHANGED = 3;
  ADMIN_USER_COMMAND_BLOCKER_TYPE_ALREADY_DELETED = 4;
}

// AdminBatchUserItemState tracks each independently idempotent target in a durable batch job.
enum AdminBatchUserItemState {
  ADMIN_BATCH_USER_ITEM_STATE_UNSPECIFIED = 0;
  ADMIN_BATCH_USER_ITEM_STATE_QUEUED = 1;
  ADMIN_BATCH_USER_ITEM_STATE_RUNNING = 2;
  ADMIN_BATCH_USER_ITEM_STATE_SUCCEEDED = 3;
  ADMIN_BATCH_USER_ITEM_STATE_FAILED = 4;
  ADMIN_BATCH_USER_ITEM_STATE_SKIPPED = 5;
  ADMIN_BATCH_USER_ITEM_STATE_CANCELED = 6;
}

// AdminBatchUserCommandType excludes deletion and device revocation, which are intentionally single-user operations.
enum AdminBatchUserCommandType {
  ADMIN_BATCH_USER_COMMAND_TYPE_UNSPECIFIED = 0;
  ADMIN_BATCH_USER_COMMAND_TYPE_SUSPEND = 1;
  ADMIN_BATCH_USER_COMMAND_TYPE_UNSUSPEND = 2;
  ADMIN_BATCH_USER_COMMAND_TYPE_REMOVE_FROM_CURRENT_ROOM = 3;
}

// AdminBatchUserOperationSortField keeps durable job lists stable across concurrent worker updates.
enum AdminBatchUserOperationSortField {
  ADMIN_BATCH_USER_OPERATION_SORT_FIELD_UNSPECIFIED = 0;
  ADMIN_BATCH_USER_OPERATION_SORT_FIELD_CREATED_AT = 1;
  ADMIN_BATCH_USER_OPERATION_SORT_FIELD_UPDATED_AT = 2;
  ADMIN_BATCH_USER_OPERATION_SORT_FIELD_BATCH_OPERATION_ID = 3;
}

// AdminUserExportField is the explicit export projection; PII fields remain distinguishable from ordinary fields.
enum AdminUserExportField {
  ADMIN_USER_EXPORT_FIELD_UNSPECIFIED = 0;
  ADMIN_USER_EXPORT_FIELD_USER_ID = 1;
  ADMIN_USER_EXPORT_FIELD_USERNAME = 2;
  ADMIN_USER_EXPORT_FIELD_STATUS = 3;
  ADMIN_USER_EXPORT_FIELD_TAGS = 4;
  ADMIN_USER_EXPORT_FIELD_CREATED_AT = 5;
  ADMIN_USER_EXPORT_FIELD_LAST_ACTIVITY_AT = 6;
  ADMIN_USER_EXPORT_FIELD_REAL_NAME = 7;
}

// AdminUserExportMaskingPolicy fixes whether a job redacts or is authorized to include requested PII.
enum AdminUserExportMaskingPolicy {
  ADMIN_USER_EXPORT_MASKING_POLICY_UNSPECIFIED = 0;
  ADMIN_USER_EXPORT_MASKING_POLICY_REDACT_PII = 1;
  ADMIN_USER_EXPORT_MASKING_POLICY_INCLUDE_AUTHORIZED_PII = 2;
}

// AdminUserExportSortField keeps export job history stable while workers update progress.
enum AdminUserExportSortField {
  ADMIN_USER_EXPORT_SORT_FIELD_UNSPECIFIED = 0;
  ADMIN_USER_EXPORT_SORT_FIELD_CREATED_AT = 1;
  ADMIN_USER_EXPORT_SORT_FIELD_UPDATED_AT = 2;
  ADMIN_USER_EXPORT_SORT_FIELD_EXPORT_ID = 3;
}

message AdminUserFilter {
  string user_id = 1;
  string username = 2;
  repeated AdminUserStatus statuses = 3;
  repeated string tag_ids = 4;
  google.protobuf.Timestamp created_from = 5;
  google.protobuf.Timestamp created_to = 6;
  google.protobuf.Timestamp last_activity_from = 7;
  google.protobuf.Timestamp last_activity_to = 8;
  AdminUserPresenceFilter presence = 9;
}

message AdminUserSort {
  AdminUserSortField field = 1;
  AdminSortDirection direction = 2;
}

message AdminUserTag {
  string tag_id = 1;
  string name = 2;
  string color = 3;
  uint64 version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message AdminUserSummary {
  string user_id = 1;
  string username = 2;
  AdminUserStatus status = 3;
  repeated AdminUserTag tags = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp last_activity_at = 7;
  bool online = 8;
  uint64 version = 9;
}

message AdminUserPIIAvailability {
  AdminUserPIIField field = 1;
  bool available = 2;
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message AdminUserNote {
  string note_id = 1;
  string user_id = 2;
  string author_admin_id = 3;
  string body = 4;
  string reason = 5;
  uint64 version = 6;
  google.protobuf.Timestamp created_at = 7;
}

message AdminUserDevice {
  string credential_id = 1;
  string label = 2;
  AdminUserDeviceState state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_activity_at = 5;
  google.protobuf.Timestamp idle_expires_at = 6;
  google.protobuf.Timestamp absolute_expires_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
  string user_agent = 9;
  uint64 version = 10;
}

message AdminUserRoomSummary {
  string room_id = 1;
  string room_code = 2;
  platform.room.v1.RoomStatus room_state = 3;
  platform.room.v1.MemberRole membership_role = 4;
  string game_id = 5;
  google.protobuf.Timestamp joined_at = 6;
  uint64 room_version = 7;
  uint64 membership_version = 8;
}

message AdminUserGameSummary {
  string session_id = 1;
  string room_id = 2;
  string game_id = 3;
  platform.game.v1.GameSessionStatus state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  uint64 session_version = 7;
}

message AdminUserGovernanceSummary {
  string operation_id = 1;
  AdminUserCommandType command = 2;
  AdminUserCommandOutcome outcome = 3;
  string reason = 4;
  string actor_admin_id = 5;
  string audit_event_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// AdminUserDetail deliberately exposes only PII availability metadata; plaintext values exist only in GetUserPIIResponse.
message AdminUserDetail {
  AdminUserSummary summary = 1;
  repeated AdminUserPIIAvailability pii_availability = 2;
  repeated AdminUserNote recent_notes = 3;
  repeated AdminUserDevice devices = 4;
  repeated AdminUserRoomSummary rooms = 5;
  repeated AdminUserGameSummary recent_games = 6;
  repeated AdminUserGovernanceSummary recent_governance = 7;
}

message ListUsersRequest {
  AdminUserFilter filter = 1;
  AdminUserSort sort = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListUsersResponse {
  repeated AdminUserSummary users = 1;
  AdminPageInfo page = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  AdminUserDetail user = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message GetUserPIIRequest {
  string user_id = 1;
  repeated AdminUserPIIField fields = 2;
  string reason = 3;
}

message AdminUserPIIValue {
  AdminUserPIIField field = 1;
  string value = 2;
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetUserPIIResponse {
  string user_id = 1;
  repeated AdminUserPIIValue values = 2;
  string access_audit_event_id = 3;
  google.protobuf.Timestamp accessed_at = 4;
}

message ListUserTagsRequest {
  string name_prefix = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListUserTagsResponse {
  repeated AdminUserTag tags = 1;
  uint64 catalog_version = 2;
  AdminPageInfo page = 3;
}

message CreateUserTagRequest {
  string operation_id = 1;
  string name = 2;
  string color = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message CreateUserTagResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserTag tag = 2;
  uint64 catalog_version = 3;
}

message UpdateUserTagRequest {
  string operation_id = 1;
  string tag_id = 2;
  string name = 3;
  string color = 4;
  string reason = 5;
  uint64 expected_version = 6;
}

message UpdateUserTagResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserTag tag = 2;
}

message DeleteUserTagRequest {
  string operation_id = 1;
  string tag_id = 2;
  string reason = 3;
  uint64 expected_version = 4;
}

message DeleteUserTagResponse {
  AdminOperationReceipt receipt = 1;
  string tag_id = 2;
  uint64 catalog_version = 3;
  int32 removed_assignments = 4;
}

message SetUserTagsRequest {
  string operation_id = 1;
  string user_id = 2;
  repeated string tag_ids = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message SetUserTagsResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserSummary user = 2;
}

message ListUserNotesRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListUserNotesResponse {
  repeated AdminUserNote notes = 1;
  AdminPageInfo page = 2;
}

message AppendUserNoteRequest {
  string operation_id = 1;
  string user_id = 2;
  string body = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message AppendUserNoteResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserNote note = 2;
  uint64 user_version = 3;
}

message AdminUserCommand {
  AdminUserCommandType type = 1;
  string room_id = 2;
  uint64 expected_room_version = 3;
  uint64 expected_membership_version = 4;
}

message AdminUserCommandBlocker {
  AdminUserCommandBlockerType type = 1;
  string resource_id = 2;
  string message_key = 3;
}

message PreviewUserCommandRequest {
  string user_id = 1;
  AdminUserCommand command = 2;
  string reason = 3;
  uint64 expected_user_version = 4;
}

message PreviewUserCommandResponse {
  string preview_id = 1;
  string preview_digest = 2;
  uint64 preview_version = 3;
  google.protobuf.Timestamp expires_at = 4;
  string user_id = 5;
  uint64 expected_user_version = 6;
  int32 affected_devices = 7;
  int32 affected_rooms = 8;
  repeated AdminUserCommandBlocker blockers = 9;
  AdminElevationScope required_elevation = 10;
  google.protobuf.Timestamp sampled_at = 11;
}

message ExecuteUserCommandRequest {
  string operation_id = 1;
  string user_id = 2;
  AdminUserCommand command = 3;
  string preview_id = 4;
  string preview_digest = 5;
  string reason = 6;
  uint64 expected_user_version = 7;
}

message ExecuteUserCommandResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserCommandOutcome outcome = 2;
  AdminUserSummary user = 3;
  int32 revoked_devices = 4;
  int32 removed_rooms = 5;
  string erasure_job_id = 6;
}

message AdminVersionedUserTarget {
  string user_id = 1;
  uint64 expected_user_version = 2;
}

message AdminExplicitUserTargets {
  repeated AdminVersionedUserTarget users = 1;
}

message AdminUserSelection {
  oneof selection {
    AdminUserFilter filter = 1;
    AdminExplicitUserTargets explicit_targets = 2;
  }
}

message PreviewBatchUserOperationRequest {
  AdminUserSelection selection = 1;
  AdminBatchUserCommandType command = 2;
  string reason = 3;
}

message PreviewBatchUserOperationResponse {
  string preview_id = 1;
  string preview_digest = 2;
  uint64 preview_version = 3;
  google.protobuf.Timestamp expires_at = 4;
  int64 target_count = 5;
  int64 executable_count = 6;
  int64 blocked_count = 7;
  repeated AdminUserCommandBlocker sampled_blockers = 8;
  AdminElevationScope required_elevation = 9;
  google.protobuf.Timestamp sampled_at = 10;
}

message AdminBatchUserOperation {
  string batch_operation_id = 1;
  AdminBatchUserCommandType command = 2;
  AdminJobState state = 3;
  int64 target_count = 4;
  int64 queued_count = 5;
  int64 running_count = 6;
  int64 succeeded_count = 7;
  int64 failed_count = 8;
  int64 skipped_count = 9;
  int64 canceled_count = 10;
  string requested_by_admin_id = 11;
  string reason = 12;
  uint64 version = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  string error_message_key = 18;
}

message StartBatchUserOperationRequest {
  string operation_id = 1;
  string preview_id = 2;
  string preview_digest = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message StartBatchUserOperationResponse {
  AdminOperationReceipt receipt = 1;
  AdminBatchUserOperation batch_operation = 2;
}

message GetBatchUserOperationRequest {
  string batch_operation_id = 1;
}

message GetBatchUserOperationResponse {
  AdminBatchUserOperation batch_operation = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message ListBatchUserOperationsRequest {
  repeated AdminJobState states = 1;
  repeated AdminBatchUserCommandType commands = 2;
  google.protobuf.Timestamp created_from = 3;
  google.protobuf.Timestamp created_to = 4;
  AdminBatchUserOperationSortField sort_field = 5;
  AdminSortDirection sort_direction = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListBatchUserOperationsResponse {
  repeated AdminBatchUserOperation batch_operations = 1;
  AdminPageInfo page = 2;
}

message AdminBatchUserOperationItem {
  string item_id = 1;
  string batch_operation_id = 2;
  string user_id = 3;
  uint64 expected_user_version = 4;
  AdminBatchUserItemState state = 5;
  int32 attempt_count = 6;
  string error_message_key = 7;
  string audit_event_id = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  uint64 version = 11;
}

message ListBatchUserOperationItemsRequest {
  string batch_operation_id = 1;
  repeated AdminBatchUserItemState states = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListBatchUserOperationItemsResponse {
  repeated AdminBatchUserOperationItem items = 1;
  AdminPageInfo page = 2;
}

message CancelBatchUserOperationRequest {
  string operation_id = 1;
  string batch_operation_id = 2;
  string reason = 3;
  uint64 expected_version = 4;
}

message CancelBatchUserOperationResponse {
  AdminOperationReceipt receipt = 1;
  AdminBatchUserOperation batch_operation = 2;
}

message RetryBatchUserOperationRequest {
  string operation_id = 1;
  string batch_operation_id = 2;
  repeated string item_ids = 3;
  string reason = 4;
  uint64 expected_version = 5;
}

message RetryBatchUserOperationResponse {
  AdminOperationReceipt receipt = 1;
  AdminBatchUserOperation batch_operation = 2;
  int64 requeued_items = 3;
}

message AdminUserExport {
  string export_id = 1;
  AdminJobState state = 2;
  AdminUserFilter filter = 3;
  repeated AdminUserExportField fields = 4;
  AdminUserExportMaskingPolicy masking_policy = 5;
  int64 matched_users = 6;
  int64 exported_users = 7;
  int64 failed_users = 8;
  bool result_available = 9;
  uint64 schema_version = 10;
  uint64 version = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp completed_at = 14;
  google.protobuf.Timestamp result_expires_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  string error_message_key = 17;
}

message CreateUserExportRequest {
  string operation_id = 1;
  AdminUserFilter filter = 2;
  repeated AdminUserExportField fields = 3;
  AdminUserExportMaskingPolicy masking_policy = 4;
  string reason = 5;
  uint64 expected_version = 6;
  int32 result_ttl_seconds = 7;
}

message CreateUserExportResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserExport export = 2;
}

message GetUserExportRequest {
  string export_id = 1;
}

message GetUserExportResponse {
  AdminUserExport export = 1;
  google.protobuf.Timestamp sampled_at = 2;
}

message ListUserExportsRequest {
  repeated AdminJobState states = 1;
  AdminUserExportMaskingPolicy masking_policy = 2;
  google.protobuf.Timestamp created_from = 3;
  google.protobuf.Timestamp created_to = 4;
  AdminUserExportSortField sort_field = 5;
  AdminSortDirection sort_direction = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListUserExportsResponse {
  repeated AdminUserExport exports = 1;
  AdminPageInfo page = 2;
}

message CreateExportDownloadGrantRequest {
  string operation_id = 1;
  string export_id = 2;
  string reason = 3;
  uint64 expected_version = 4;
  // The handler must match this value against the stored export before issuing a grant.
  AdminUserExportMaskingPolicy expected_masking_policy = 5;
}

message CreateExportDownloadGrantResponse {
  AdminOperationReceipt receipt = 1;
  string download_grant = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message DeleteExportResultRequest {
  string operation_id = 1;
  string export_id = 2;
  string reason = 3;
  uint64 expected_version = 4;
}

message DeleteExportResultResponse {
  AdminOperationReceipt receipt = 1;
  AdminUserExport export = 2;
}
