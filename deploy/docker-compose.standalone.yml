# Game Night 单容器部署编排
# 应用使用外部 PostgreSQL/Redis；密钥与本地 checkpoint 由 Docker 命名卷持久化。
# 部署目录只需本文件和 .env，不依赖宿主机绝对路径或 secrets 目录。

name: game-night

networks:
  deployment:
    external: true
    name: ${GAME_NIGHT_EXTERNAL_NETWORK:-1panel-network}

services:
  # 将 .env 中的稳定 Base64 密钥写入只读运行卷；重复执行会写回同一份内容，不会轮换密钥。
  secrets-init:
    image: ${GAME_NIGHT_SECRETS_INIT_IMAGE:-alpine:3.22}
    container_name: game-night-secrets-init
    restart: "no"
    entrypoint: ["/bin/sh", "-euc"]
    command: |
      umask 077
      printf '%s' "$${GAME_NIGHT_SECRET_ADMIN_BOOTSTRAP_B64}" | base64 -d > /api-target/admin-bootstrap.txt
      printf '%s' "$${GAME_NIGHT_SECRET_ADMIN_CHALLENGE_B64}" | base64 -d > /api-target/admin-challenge.json
      printf '%s' "$${GAME_NIGHT_SECRET_ADMIN_CURSOR_B64}" | base64 -d > /api-target/admin-cursor.json
      printf '%s' "$${GAME_NIGHT_SECRET_ADMIN_SESSION_B64}" | base64 -d > /api-target/admin-session.json
      printf '%s' "$${GAME_NIGHT_SECRET_AUDIT_B64}" | base64 -d > /api-target/audit.json
      printf '%s' "$${GAME_NIGHT_SECRET_DEVICE_B64}" | base64 -d > /api-target/device.json
      printf '%s' "$${GAME_NIGHT_SECRET_PII_B64}" | base64 -d > /api-target/pii.json
      printf '%s' "$${GAME_NIGHT_SECRET_RATE_LIMIT_B64}" | base64 -d > /api-target/rate-limit.json
      printf '%s' "$${GAME_NIGHT_SECRET_RESULT_ENVELOPE_B64}" | base64 -d > /api-target/result-envelope.json
      printf '%s' "$${GAME_NIGHT_SECRET_TOTP_B64}" | base64 -d > /api-target/totp.json
      printf '%s' "$${GAME_NIGHT_SECRET_USER_CHALLENGE_B64}" | base64 -d > /api-target/user-challenge.json
      cp /api-target/pii.json /api-target/totp.json /api-target/audit.json /worker-target/
      chown -R 10001:10001 /api-target /worker-target
      chmod 0400 /api-target/* /worker-target/*
    environment:
      GAME_NIGHT_SECRET_ADMIN_BOOTSTRAP_B64: ${GAME_NIGHT_SECRET_ADMIN_BOOTSTRAP_B64:?GAME_NIGHT_SECRET_ADMIN_BOOTSTRAP_B64 is required}
      GAME_NIGHT_SECRET_ADMIN_CHALLENGE_B64: ${GAME_NIGHT_SECRET_ADMIN_CHALLENGE_B64:?GAME_NIGHT_SECRET_ADMIN_CHALLENGE_B64 is required}
      GAME_NIGHT_SECRET_ADMIN_CURSOR_B64: ${GAME_NIGHT_SECRET_ADMIN_CURSOR_B64:?GAME_NIGHT_SECRET_ADMIN_CURSOR_B64 is required}
      GAME_NIGHT_SECRET_ADMIN_SESSION_B64: ${GAME_NIGHT_SECRET_ADMIN_SESSION_B64:?GAME_NIGHT_SECRET_ADMIN_SESSION_B64 is required}
      GAME_NIGHT_SECRET_AUDIT_B64: ${GAME_NIGHT_SECRET_AUDIT_B64:?GAME_NIGHT_SECRET_AUDIT_B64 is required}
      GAME_NIGHT_SECRET_DEVICE_B64: ${GAME_NIGHT_SECRET_DEVICE_B64:?GAME_NIGHT_SECRET_DEVICE_B64 is required}
      GAME_NIGHT_SECRET_PII_B64: ${GAME_NIGHT_SECRET_PII_B64:?GAME_NIGHT_SECRET_PII_B64 is required}
      GAME_NIGHT_SECRET_RATE_LIMIT_B64: ${GAME_NIGHT_SECRET_RATE_LIMIT_B64:?GAME_NIGHT_SECRET_RATE_LIMIT_B64 is required}
      GAME_NIGHT_SECRET_RESULT_ENVELOPE_B64: ${GAME_NIGHT_SECRET_RESULT_ENVELOPE_B64:?GAME_NIGHT_SECRET_RESULT_ENVELOPE_B64 is required}
      GAME_NIGHT_SECRET_TOTP_B64: ${GAME_NIGHT_SECRET_TOTP_B64:?GAME_NIGHT_SECRET_TOTP_B64 is required}
      GAME_NIGHT_SECRET_USER_CHALLENGE_B64: ${GAME_NIGHT_SECRET_USER_CHALLENGE_B64:?GAME_NIGHT_SECRET_USER_CHALLENGE_B64 is required}
    volumes:
      - game_night_api_secrets:/api-target
      - game_night_worker_secrets:/worker-target

  # 单体拓扑：API、实时服务、worker、迁移和边缘网关由同一个镜像拉起，
  # 适合开发环境、小型自托管环境，或先验证部署链路的场景。
  game-night:
    # 生产环境建议显式固定 GAME_NIGHT_IMAGE，避免重新部署时意外拉取 latest。
    image: ${GAME_NIGHT_IMAGE:-ghcr.io/ifty-r/game-night:latest}
    # 固定容器名可以让日志、exec 和运维手册中的命令保持稳定。
    container_name: game-night
    # serve-all 会同时托管所有服务端角色；除非拆分下面的环境变量块，
    # 否则不要把它替换为单一角色启动命令。
    command: ["serve-all"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    # 自动恢复临时故障，同时仍然尊重手动执行的 docker compose stop。
    restart: unless-stopped
    # 给 API 请求、实时会话和 worker 租约预留优雅退出时间。
    stop_grace_period: ${GAME_NIGHT_STOP_GRACE_PERIOD:-65s}
    ports:
      # 只发布边缘网关端口；API、实时服务和 worker 监听都留在容器内部回环地址。
      # 宿主机绑定默认使用 localhost，避免开发部署被意外暴露到外网。
      - "${GAME_NIGHT_HTTP_BIND_ADDRESS:-127.0.0.1}:${GAME_NIGHT_HTTP_PUBLISHED_PORT:-40891}:8080"
    extra_hosts:
      # 允许容器访问运行在 Docker 宿主机上的外部托管服务。
      - "host.docker.internal:host-gateway"
    networks:
      - deployment
    volumes:
      # 初始化容器持有写权限，应用进程只读挂载用途隔离后的密钥卷。
      - game_night_api_secrets:/run/game-night/api-secrets:ro
      - game_night_worker_secrets:/run/game-night/worker-secrets:ro
      # 本地 append-only checkpoint 通过命名卷持久化；需要跨主机保留时可改用 S3 sink。
      - game_night_checkpoints:/var/lib/game-night/checkpoints
    environment:
      # 下面先列部署者需要通过 .env 调整的外部环境和基础设施配置。
      GAME_NIGHT_ENVIRONMENT: ${GAME_NIGHT_ENVIRONMENT:-development}
      # 所有角色共享同一个逻辑 schema；下面各数据库连接串仍然可以使用不同账号。
      GAME_NIGHT_DATABASE_SCHEMA: ${GAME_NIGHT_DATABASE_SCHEMA:-game_night}
      # Redis 用于短期协调状态；每套环境都应使用独立 key 前缀，避免串数据。
      GAME_NIGHT_REDIS_URL: ${GAME_NIGHT_REDIS_URL:?GAME_NIGHT_REDIS_URL is required}
      GAME_NIGHT_REDIS_KEY_PREFIX: ${GAME_NIGHT_REDIS_KEY_PREFIX:-game-night:compose:}
      # 协调请求需要快速失败，避免玩家操作因为基础设施等待而长时间卡住。
      GAME_NIGHT_REDIS_TIMEOUT: ${GAME_NIGHT_REDIS_TIMEOUT:-1s}
      # 浏览器可访问源必须匹配玩家端和管理端实际使用的访问地址。
      GAME_NIGHT_USER_ORIGINS: ${GAME_NIGHT_USER_ORIGINS:-http://localhost:40891}
      GAME_NIGHT_ADMIN_ORIGINS: ${GAME_NIGHT_ADMIN_ORIGINS:-http://admin.localhost:40891}
      # 只信任真正负责 TLS 终止或注入客户端 IP 头的反向代理网段。
      GAME_NIGHT_TRUSTED_PROXY_CIDRS: ${GAME_NIGHT_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      # 公网 HTTPS 部署应设为 true，让浏览器会话使用 Secure Cookie。
      GAME_NIGHT_COOKIE_SECURE: ${GAME_NIGHT_COOKIE_SECURE:-false}
      # 小规模单机生产允许使用本地 sink，不强制依赖 S3/WORM。
      GAME_NIGHT_CHECKPOINT_SINK: local
      GAME_NIGHT_CHECKPOINT_LOCAL_DIRECTORY: /var/lib/game-night/checkpoints

      # serve-all 会把每个数据库连接串分发给对应的子进程。
      # 生产环境如果需要权限隔离，应在这里给各角色配置不同 PostgreSQL 账号。
      GAME_NIGHT_API_DATABASE_URL: ${GAME_NIGHT_API_DATABASE_URL:?GAME_NIGHT_API_DATABASE_URL is required}
      GAME_NIGHT_REALTIME_DATABASE_URL: ${GAME_NIGHT_REALTIME_DATABASE_URL:?GAME_NIGHT_REALTIME_DATABASE_URL is required}
      GAME_NIGHT_WORKER_DATABASE_URL: ${GAME_NIGHT_WORKER_DATABASE_URL:?GAME_NIGHT_WORKER_DATABASE_URL is required}
      # 迁移连接串通常需要比运行期服务账号更高的 DDL 权限。
      GAME_NIGHT_MIGRATION_DATABASE_URL: ${GAME_NIGHT_MIGRATION_DATABASE_URL:?GAME_NIGHT_MIGRATION_DATABASE_URL is required}
      # 迁移器需要显式角色边界；单账号部署可将五项配置为同一 PostgreSQL role。
      GAME_NIGHT_DATABASE_OWNER_ROLE: ${GAME_NIGHT_DATABASE_OWNER_ROLE:?GAME_NIGHT_DATABASE_OWNER_ROLE is required}
      GAME_NIGHT_DATABASE_AUDIT_WRITER_ROLE: ${GAME_NIGHT_DATABASE_AUDIT_WRITER_ROLE:?GAME_NIGHT_DATABASE_AUDIT_WRITER_ROLE is required}
      GAME_NIGHT_DATABASE_MIGRATION_ROLE: ${GAME_NIGHT_DATABASE_MIGRATION_ROLE:?GAME_NIGHT_DATABASE_MIGRATION_ROLE is required}
      GAME_NIGHT_DATABASE_RUNTIME_ROLE: ${GAME_NIGHT_DATABASE_RUNTIME_ROLE:?GAME_NIGHT_DATABASE_RUNTIME_ROLE is required}
      GAME_NIGHT_DATABASE_WORKER_ROLE: ${GAME_NIGHT_DATABASE_WORKER_ROLE:?GAME_NIGHT_DATABASE_WORKER_ROLE is required}
      GAME_NIGHT_API_KEYRING_DIRECTORY: /run/game-night/api-secrets
      GAME_NIGHT_WORKER_KEYRING_DIRECTORY: /run/game-night/worker-secrets
      # 初始化管理密钥通过文件注入，避免把初始管理员凭据写进镜像。
      # 管理员初始化完成后可在 .env 中把 GAME_NIGHT_API_BOOTSTRAP_SECRET_FILE 设为空并重启。
      GAME_NIGHT_API_BOOTSTRAP_SECRET_FILE: ${GAME_NIGHT_API_BOOTSTRAP_SECRET_FILE-/run/game-night/api-secrets/admin-bootstrap.txt}

      # 以下是容器内部固定布线，不需要在 1Panel 里配置。
      # 这些地址只在同一个容器内互相调用，不能改成宿主机端口或公网域名。
      # API 只绑定内部地址；浏览器流量统一从下面的边缘网关进入。
      GAME_NIGHT_API_LISTEN_ADDRESS: 127.0.0.1:8081
      GAME_NIGHT_API_INSTANCE_ID: ${GAME_NIGHT_API_INSTANCE_ID:-api-standalone}
      GAME_NIGHT_ADMIN_HEARTBEAT_URL: http://127.0.0.1:8081/internal/admin/operations/heartbeat
      GAME_NIGHT_ADMIN_HEARTBEAT_TOKEN: ${GAME_NIGHT_ADMIN_HEARTBEAT_TOKEN:?GAME_NIGHT_ADMIN_HEARTBEAT_TOKEN is required}
      # 服务间访问实时服务时使用内部共享 token 保护。
      GAME_NIGHT_API_REALTIME_BOOTSTRAP_URL: http://127.0.0.1:8091
      GAME_NIGHT_API_REALTIME_PEER_URLS: http://127.0.0.1:8091
      GAME_NIGHT_API_REALTIME_INTERNAL_TOKEN: ${GAME_NIGHT_REALTIME_INTERNAL_TOKEN:?GAME_NIGHT_REALTIME_INTERNAL_TOKEN is required}
      # 审计检查点按事件数量或时间间隔触发，任一条件先满足就写入。
      GAME_NIGHT_AUDIT_CHECKPOINT_MAX_EVENTS: ${GAME_NIGHT_AUDIT_CHECKPOINT_MAX_EVENTS:-100}
      GAME_NIGHT_AUDIT_CHECKPOINT_MAX_INTERVAL: ${GAME_NIGHT_AUDIT_CHECKPOINT_MAX_INTERVAL:-5m}

      # 实时服务拆分玩家 WebSocket 入口和内部控制入口，避免暴露管理通道。
      GAME_NIGHT_REALTIME_PUBLIC_LISTEN_ADDRESS: 127.0.0.1:8090
      GAME_NIGHT_REALTIME_INTERNAL_LISTEN_ADDRESS: 127.0.0.1:8091
      # 单容器模式下所有角色在同一容器内，广播地址使用内部地址即可。
      GAME_NIGHT_REALTIME_ADVERTISED_URL: http://127.0.0.1:8091
      # 如果将来拆成多副本部署，每个实时服务实例 ID 必须唯一。
      GAME_NIGHT_REALTIME_INSTANCE_ID: ${GAME_NIGHT_REALTIME_INSTANCE_ID:-realtime-standalone}
      GAME_NIGHT_REALTIME_INTERNAL_TOKEN: ${GAME_NIGHT_REALTIME_INTERNAL_TOKEN:?GAME_NIGHT_REALTIME_INTERNAL_TOKEN is required}

      # 边缘网关是唯一对外监听点，负责静态资源、API 代理和 WebSocket 代理。
      # 容器内固定监听 8080；宿主机发布端口由上面的 ports 映射控制。
      GAME_NIGHT_EDGE_LISTEN_ADDRESS: ":8080"
      GAME_NIGHT_EDGE_API_UPSTREAM_URL: http://127.0.0.1:8081
      GAME_NIGHT_EDGE_REALTIME_UPSTREAM_URL: http://127.0.0.1:8090
      GAME_NIGHT_EDGE_USER_STATIC_DIRECTORY: /app/web
      GAME_NIGHT_EDGE_ADMIN_STATIC_DIRECTORY: /app/admin
      # Host 白名单决定请求返回玩家端还是管理端前端资源。
      # 127.0.0.1:8080 是容器内 healthcheck 的 authority，不能从白名单移除。
      GAME_NIGHT_EDGE_USER_HOSTS: ${GAME_NIGHT_EDGE_USER_HOSTS:-localhost:40891,127.0.0.1:40891,127.0.0.1:8080}
      GAME_NIGHT_EDGE_ADMIN_HOSTS: ${GAME_NIGHT_EDGE_ADMIN_HOSTS:-admin.localhost:40891}
      GAME_NIGHT_EDGE_TRUSTED_PROXY_CIDRS: ${GAME_NIGHT_EDGE_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}

      # worker 配置控制异步任务归属、批处理节奏、轮询频率和房间空闲过期。
      GAME_NIGHT_WORKER_INSTANCE_ID: ${GAME_NIGHT_WORKER_INSTANCE_ID:-worker-standalone}
      GAME_NIGHT_WORKER_LEASE_DURATION: ${GAME_NIGHT_WORKER_LEASE_DURATION:-1m}
      GAME_NIGHT_WORKER_BATCH_SIZE: ${GAME_NIGHT_WORKER_BATCH_SIZE:-10}
      GAME_NIGHT_WORKER_POLL_INTERVAL: ${GAME_NIGHT_WORKER_POLL_INTERVAL:-1s}
      GAME_NIGHT_ROOM_IDLE_TIMEOUT: ${GAME_NIGHT_ROOM_IDLE_TIMEOUT:-10m}
    healthcheck:
      # 使用程序自带的健康检查命令，而不是只判断容器进程是否还活着。
      test: ["CMD", "game-night", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  game_night_api_secrets:
    name: game-night-api-secrets
  game_night_worker_secrets:
    name: game-night-worker-secrets
  game_night_checkpoints:
    name: game-night-checkpoints
